<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a2119">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="礼品管家">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>礼品管家</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="offlineBar" class="offline-bar"></div>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="logo">礼</div>
      <div>
        <div class="brand-name">礼品管家</div>
        <div class="brand-sub" id="brandSub">客户 · 厂家 · SKU</div>
      </div>
    </div>

    <nav id="nav">
      <button class="nav-btn active" data-view="inbox"><span>待办</span><em id="cntInbox">0</em></button>
      <button class="nav-btn" data-view="customers"><span>客户</span><em id="cntCustomers">0</em></button>
      <button class="nav-btn" data-view="products"><span>产品库</span><em id="cntSkus">0</em></button>
      <button class="nav-btn" data-view="suppliers"><span>厂家</span><em id="cntSuppliers">0</em></button>
      <button class="nav-btn" data-view="quote"><span>报价</span><em></em></button>
      <button class="nav-btn" data-view="orders"><span>订单</span><em id="cntOrders">0</em></button>
      <button class="nav-btn" data-view="pools"><span>拼单</span><em id="cntPools">0</em></button>
      <button class="nav-btn" data-view="samples"><span>打样</span><em id="cntSamples">0</em></button>
      <button class="nav-btn" data-view="dashboard"><span>看板</span><em></em></button>
      <button class="nav-btn" data-view="data"><span>数据</span><em></em></button>
    </nav>

    <div class="rail-foot">
      <div class="tip" id="savedTip">正在连接…</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="search-wrap">
        <input id="globalSearch" type="search" placeholder="搜公司、联系人、品牌、产品、规格…">
      </div>
      <div class="topbar-actions" id="topActions"></div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>

<div id="drawerMask" class="drawer-mask"></div>
<aside id="drawer" class="drawer">
  <div class="drawer-head">
    <h3 id="drawerTitle">客户详情</h3>
    <button class="icon-btn" id="drawerClose">×</button>
  </div>
  <div id="drawerBody" class="drawer-body"></div>
</aside>

<div id="modalMask" class="modal-mask">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">新增</h3>
      <button class="icon-btn" id="modalClose">×</button>
    </div>
    <form id="modalForm" class="modal-body"></form>
    <div class="modal-foot">
      <button type="button" class="btn ghost" id="modalCancel">取消</button>
      <button type="submit" form="modalForm" class="btn primary">保存</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<!-- 启动中 -->
<div id="boot" class="login on">
  <div class="login-card" style="text-align:center">
    <div class="login-logo">礼</div>
    <h1>礼品管家</h1>
    <p class="login-sub" id="bootMsg">正在进入…</p>
  </div>
</div>

<!-- 登录挡板（只在自动进入失败时出现） -->
<div id="login" class="login">
  <form id="loginForm" class="login-card">
    <div class="login-logo">礼</div>
    <h1>礼品管家</h1>
    <p class="login-sub">客户 · 厂家 · SKU · 报价</p>
    <label>账号</label>
    <input id="loginEmail" type="text" autocomplete="username" placeholder="lipin">
    <label>密码</label>
    <input id="loginPass" type="password" autocomplete="current-password" placeholder="lipin888">
    <button type="submit" id="loginBtn">登录</button>
    <div id="loginErr" class="login-err"></div>
  </form>
</div>

<script src="app.js"></script>
<script src="orders.js"></script>
<script src="pools.js"></script>
<script src="print.js"></script>
<script src="proposal.js"></script>
<script src="trash.js"></script>
<script src="templates.js"></script>
<script src="scripts.js"></script>
<script src="insight.js"></script>
<script src="dashboard.js"></script>
<script src="supply.js"></script>
<script src="sample.js"></script>
</body>
</html>
